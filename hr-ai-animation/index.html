<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HR Data &amp; Tools</title>
<style>
  :root {
    --bg: #0f1a2b;
    --ink: #eef3fb;
    --muted: #9fb0c8;
    --teal: #19b3a6;
    --coral: #ff7a59;
    --panel: rgba(15, 26, 43, 0.72);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eaf1f8;
      --ink: #12233b;
      --muted: #4d607a;
      --panel: rgba(255, 255, 255, 0.78);
    }
  }
  :root[data-theme="light"] {
    --bg: #eaf1f8; --ink: #12233b; --muted: #4d607a; --panel: rgba(255,255,255,0.78);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas#scene { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; left: 16px; right: 16px; top: 16px; pointer-events: none;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .card { background: var(--panel); backdrop-filter: blur(8px); border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.15); }
  h1 { margin: 0; font-size: clamp(15px, 2.2vw, 22px); font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; font-size: clamp(12px, 1.4vw, 14px); color: var(--muted); }
  .legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .bottom { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 12px; }
  .bar { flex: 1; height: 4px; border-radius: 4px; background: rgba(128,128,128,0.3); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--coral)); }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid rgba(128,128,128,0.35);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 52px; text-align: right; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <div class="card">
    <h1>HR Data &amp; Tools × People &amp; Culture</h1>
    <p class="sub">Building AI agents · rolling out new software · creating reports — together</p>
  </div>
  <div class="card legend">
    <span><i class="dot" style="background:var(--teal)"></i>HR Data &amp; Tools team</span>
    <span><i class="dot" style="background:var(--coral)"></i>People &amp; Culture colleagues</span>
  </div>
</div>

<div class="bottom">
  <button id="toggle" type="button">Pause</button>
  <div class="bar"><i id="progress"></i></div>
  <div class="time" id="time">0.0 / 5s</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const LOOP = 5;              // seconds
  const TAU = Math.PI * 2;
  const COLORS = {
    teal: 0x19b3a6, coral: 0xff7a59, navy: 0x1d3557, gold: 0xf4c430,
    skin: [0xf1c27d, 0xc68642, 0x8d5524, 0xffdbac, 0xe0ac69],
    floor: 0xdfe8f2, stone: 0xf3f0ea, screen: 0x0e1b2c,
  };

  // ---------- helpers ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const wave = (t, k = 1, phase = 0) => Math.sin(TAU * (k * t + phase));   // loop-safe when k is integer
  const backOut = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, ...opts });

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function labelSprite(text, bg = "#1d3557", fg = "#ffffff", scale = 1) {
    const c = document.createElement("canvas");
    const ctx = c.getContext("2d");
    ctx.font = "700 44px Inter, system-ui, sans-serif";
    const w = Math.ceil(ctx.measureText(text).width) + 56;
    c.width = w; c.height = 84;
    ctx.font = "700 44px Inter, system-ui, sans-serif";
    ctx.fillStyle = bg; roundRect(ctx, 0, 0, w, 84, 42); ctx.fill();
    ctx.fillStyle = fg; ctx.textBaseline = "middle"; ctx.fillText(text, 28, 44);
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    s.scale.set((w / 84) * 0.55 * scale, 0.55 * scale, 1);
    s.renderOrder = 10;
    return s;
  }

  function canvasScreen(w, h, pxW, pxH) {
    const c = document.createElement("canvas"); c.width = pxW; c.height = pxH;
    const tex = new THREE.CanvasTexture(c);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
    return { mesh, ctx: c.getContext("2d"), tex, w: pxW, h: pxH };
  }

  // ---------- renderer / scene ----------
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcfe0f1);
  scene.fog = new THREE.Fog(0xcfe0f1, 26, 48);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(6, 14, 9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 40 });
  scene.add(sun);

  // floor
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(13, 13.4, 0.5, 72), mat(COLORS.floor));
  floor.position.y = -0.25; floor.receiveShadow = true; scene.add(floor);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(13.05, 0.08, 8, 96), mat(COLORS.teal, { emissive: COLORS.teal, emissiveIntensity: 0.4 }));
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.01; scene.add(ring);

  // ---------- bank building (generic) ----------
  const bank = new THREE.Group(); bank.position.set(0, 0, -9.5); scene.add(bank);
  const stoneM = mat(COLORS.stone);
  const base = new THREE.Mesh(new THREE.BoxGeometry(16, 0.6, 3), stoneM); base.position.y = 0.3; bank.add(base);
  const step = new THREE.Mesh(new THREE.BoxGeometry(17, 0.3, 3.6), stoneM); step.position.y = 0.15; bank.add(step);
  for (let i = 0; i < 8; i++) {
    const col = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, 5.2, 20), stoneM);
    col.position.set(-7 + i * 2, 3.2, 0.6); col.castShadow = true; bank.add(col);
  }
  const wall = new THREE.Mesh(new THREE.BoxGeometry(15.6, 5.2, 0.6), mat(0xe7e1d6)); wall.position.set(0, 3.2, -0.9); bank.add(wall);
  const entab = new THREE.Mesh(new THREE.BoxGeometry(16.4, 0.9, 3.2), stoneM); entab.position.y = 6.25; bank.add(entab);
  const pedShape = new THREE.Shape(); pedShape.moveTo(-8.2, 0); pedShape.lineTo(8.2, 0); pedShape.lineTo(0, 2.2); pedShape.closePath();
  const ped = new THREE.Mesh(new THREE.ExtrudeGeometry(pedShape, { depth: 3, bevelEnabled: false }), stoneM);
  ped.position.set(0, 6.7, -1.5); bank.add(ped);

  // floating coins
  const coins = [];
  const coinGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.1, 32);
  const coinM = mat(COLORS.gold, { metalness: 0.6, roughness: 0.3, emissive: 0x6b4e00, emissiveIntensity: 0.25 });
  [[-9, 7.5, -6], [9.5, 8, -5], [-11, 5, -2], [11, 5.5, -1]].forEach((p, i) => {
    const c = new THREE.Mesh(coinGeo, coinM); c.rotation.x = Math.PI / 2; c.position.set(...p);
    c.userData = { y: p[1], phase: i * 0.25 }; scene.add(c); coins.push(c);
  });

  // ---------- people ----------
  function makePerson(shirt, skin, opts = {}) {
    const g = new THREE.Group();
    const shirtM = mat(shirt), skinM = mat(skin), pantsM = mat(opts.pants || 0x2b3a55);
    const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.12, 0.9, 12), pantsM);
    const legR = legL.clone();
    legL.position.set(-0.16, 0.45, 0); legR.position.set(0.16, 0.45, 0);
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 1.0, 18), shirtM); torso.position.y = 1.4;
    const shoulders = new THREE.Mesh(new THREE.SphereGeometry(0.33, 18, 12, 0, TAU, 0, Math.PI / 2), shirtM); shoulders.position.y = 1.9;
    const headPivot = new THREE.Group(); headPivot.position.y = 2.05;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 18), skinM); head.position.y = 0.28;
    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.295, 24, 12, 0, TAU, 0, Math.PI / 2.1), mat(opts.hair || 0x2a1d14));
    hair.position.y = 0.3; hair.rotation.x = -0.25;
    const eyeM = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), eyeM); eyeL.position.set(-0.1, 0.3, 0.255);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.1;
    headPivot.add(head, hair, eyeL, eyeR);
    // badge on chest
    const badge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.2, 0.02), mat(0xffffff)); badge.position.set(0.16, 1.6, 0.34);

    function arm(side) {
      const pivot = new THREE.Group(); pivot.position.set(side * 0.42, 1.82, 0);
      const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.09, 0.75, 10), shirtM); upper.position.y = -0.36;
      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), skinM); hand.position.y = -0.78;
      pivot.add(upper, hand); return pivot;
    }
    const armL = arm(-1), armR = arm(1);
    g.add(legL, legR, torso, shoulders, headPivot, badge, armL, armR);
    g.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
    g.userData = { headPivot, armL, armR, torso };
    return g;
  }

  const people = [];
  function addPerson(team, x, z, faceX, faceZ, skinIdx, role, phase = 0, hair) {
    const p = makePerson(team === "hr" ? COLORS.teal : COLORS.coral, COLORS.skin[skinIdx % COLORS.skin.length], { hair });
    p.position.set(x, 0, z);
    p.rotation.y = Math.atan2(faceX - x, faceZ - z);
    scene.add(p);
    people.push({ obj: p, team, role, phase });
    return p;
  }

  // ---------- data hub ----------
  const hub = new THREE.Group(); hub.position.set(0, 5.6, -1.5); scene.add(hub);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.75, 0), mat(COLORS.teal, { emissive: COLORS.teal, emissiveIntensity: 0.55, flatShading: true }));
  const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 1), new THREE.MeshBasicMaterial({ color: 0x7ff3e6, wireframe: true, transparent: true, opacity: 0.45 }));
  const orbit = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.03, 8, 80), new THREE.MeshBasicMaterial({ color: COLORS.coral }));
  orbit.rotation.x = Math.PI / 2.4;
  hub.add(core, shell, orbit);
  const hubLight = new THREE.PointLight(0x5ff0e0, 0.8, 12); hub.add(hubLight);
  const hubLabel = labelSprite("HR Data & Tools", "#19b3a6", "#ffffff", 1.05); hubLabel.position.set(0, 1.85, 0); hub.add(hubLabel);

  // ---------- stations ----------
  const STATIONS = {
    agent:    new THREE.Vector3(-6, 0, -2.2),
    software: new THREE.Vector3(0, 0, -3.6),
    reports:  new THREE.Vector3(6, 0, -2.2),
  };

  function desk(group, w = 2.6) {
    const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.12, 1.2), mat(0xffffff));
    top.position.y = 1.0; top.castShadow = top.receiveShadow = true;
    const legM = mat(0x9aa8ba);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
      const l = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 8), legM);
      l.position.set(sx * (w / 2 - 0.15), 0.5, sz * 0.45); group.add(l);
    });
    group.add(top);
  }

  // --- 1. AI agent builder ---
  const agentG = new THREE.Group(); agentG.position.copy(STATIONS.agent); agentG.rotation.y = 0.45; scene.add(agentG);
  desk(agentG);
  const tablet = canvasScreen(1.9, 1.15, 512, 310);
  const tabletFrame = new THREE.Mesh(new THREE.BoxGeometry(2.05, 1.3, 0.08), mat(0x22324a));
  tabletFrame.position.set(-0.2, 1.75, -0.3); tabletFrame.rotation.x = -0.2;
  tablet.mesh.position.set(0, 0, 0.045); tabletFrame.add(tablet.mesh); agentG.add(tabletFrame);

  // robot (the AI agent being built)
  const robot = new THREE.Group(); robot.position.set(1.85, 0, 0.35); agentG.add(robot);
  const robotM = mat(0xf5f7fb, { metalness: 0.3, roughness: 0.35 });
  const accentM = mat(COLORS.teal, { emissive: COLORS.teal, emissiveIntensity: 0.3 });
  const rBase = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.25, 24), mat(0x22324a)); rBase.position.y = 0.12;
  const rBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.55), robotM); rBody.position.y = 0.8;
  const rChest = new THREE.Mesh(new THREE.CircleGeometry(0.15, 24), new THREE.MeshBasicMaterial({ color: 0x5ff0e0 })); rChest.position.set(0, 0.85, 0.28);
  const rHead = new THREE.Group(); rHead.position.y = 1.55;
  const rSkull = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.5), robotM);
  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.22, 0.02), mat(COLORS.screen)); visor.position.z = 0.26;
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x5ff0e0 });
  const rEyeL = new THREE.Mesh(new THREE.CircleGeometry(0.05, 16), eyeMat); rEyeL.position.set(-0.13, 0, 0.275);
  const rEyeR = rEyeL.clone(); rEyeR.position.x = 0.13;
  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 6), robotM); antenna.position.y = 0.4;
  const antTip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 12), new THREE.MeshBasicMaterial({ color: COLORS.coral })); antTip.position.y = 0.58;
  rHead.add(rSkull, visor, rEyeL, rEyeR, antenna, antTip);
  const rArmL = new THREE.Group(); rArmL.position.set(-0.5, 1.15, 0);
  const rArmR = new THREE.Group(); rArmR.position.set(0.5, 1.15, 0);
  [rArmL, rArmR].forEach((a) => {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.6, 10), accentM); seg.position.y = -0.3;
    const claw = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 10), robotM); claw.position.y = -0.62;
    a.add(seg, claw);
  });
  robot.add(rBase, rBody, rChest, rHead, rArmL, rArmR);
  robot.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  const scanRing = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.025, 8, 48), new THREE.MeshBasicMaterial({ color: 0x5ff0e0, transparent: true }));
  scanRing.rotation.x = Math.PI / 2; robot.add(scanRing);
  const bubble = labelSprite("Hi! I'm your HR policy agent", "#ffffff", "#1d3557", 0.75);
  bubble.position.set(0, 2.45, 0); robot.add(bubble);

  const agentLabel = labelSprite("🤖  AI Agents", "#1d3557"); agentLabel.position.set(0, 3.6, 0); agentG.add(agentLabel);
  addPerson("hr", -8.4, -1.6, -6.4, -2.6, 0, "explain", 0, 0x1a1a1a);
  addPerson("pc", -7.9, 0.2, -6.0, -2.4, 1, "nod", 0.3, 0x5a3a22);
  addPerson("pc", -3.1, -3.9, -4.2, -2.7, 3, "cheer", 0.6, 0xb5651d);

  // --- 2. New software rollout ---
  const swG = new THREE.Group(); swG.position.copy(STATIONS.software); scene.add(swG);
  desk(swG, 3.2);
  const monitor = canvasScreen(2.6, 1.55, 640, 380);
  const monFrame = new THREE.Mesh(new THREE.BoxGeometry(2.78, 1.72, 0.1), mat(0x22324a));
  monFrame.position.set(0, 2.15, -0.25); monitor.mesh.position.z = 0.055; monFrame.add(monitor.mesh);
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 8), mat(0x9aa8ba)); stand.position.set(0, 1.3, -0.25);
  swG.add(monFrame, stand);
  // laptop with flying app icons
  const appIcons = [];
  const iconColors = [COLORS.teal, COLORS.coral, COLORS.gold, 0x6c8cff];
  for (let i = 0; i < 4; i++) {
    const ic = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 0.08), mat(iconColors[i], { emissive: iconColors[i], emissiveIntensity: 0.25 }));
    ic.castShadow = true; swG.add(ic); appIcons.push(ic);
  }
  const check = new THREE.Group();
  const checkM = new THREE.MeshBasicMaterial({ color: 0x2ecc71 });
  const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.42, 0.08), checkM); c1.position.set(-0.17, -0.05, 0); c1.rotation.z = 0.8;
  const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.8, 0.08), checkM); c2.position.set(0.12, 0.1, 0); c2.rotation.z = -0.6;
  const checkDisc = new THREE.Mesh(new THREE.CircleGeometry(0.6, 32), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  checkDisc.position.z = -0.05; check.add(checkDisc, c1, c2); check.position.set(1.85, 3.35, 0); swG.add(check);

  const swLabel = labelSprite("💻  New Software", "#1d3557"); swLabel.position.set(0, 4.2, 0); swG.add(swLabel);
  addPerson("hr", -1.9, -2.5, -0.6, -3.9, 4, "point", 0.1, 0x3b2a1a);
  addPerson("pc", 2.3, -2.8, 0.6, -3.9, 2, "nod", 0.45, 0x111111);
  addPerson("pc", 1.3, -1.6, 0.5, -3.8, 0, "type", 0.7, 0xd9b26a);

  // --- 3. Reports ---
  const repG = new THREE.Group(); repG.position.copy(STATIONS.reports); repG.rotation.y = -0.45; scene.add(repG);
  const board = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.3, 0.12), mat(0xffffff));
  board.position.set(0, 2.15, -0.4); board.castShadow = true;
  const boardLegs = new THREE.Mesh(new THREE.BoxGeometry(3.0, 1.0, 0.06), mat(0x9aa8ba)); boardLegs.position.set(0, 0.5, -0.4);
  repG.add(board, boardLegs);
  const bars = [];
  const barColors = [COLORS.teal, COLORS.coral, COLORS.teal, COLORS.gold, COLORS.coral];
  const barTargets = [0.7, 1.1, 0.9, 1.5, 1.3];
  barTargets.forEach((h, i) => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.32, 1, 0.22), mat(barColors[i]));
    b.position.set(-1.35 + i * 0.45, 1.15, -0.25); b.castShadow = true; repG.add(b); bars.push({ mesh: b, h });
  });
  // trend line made of small spheres
  const trendDots = [];
  for (let i = 0; i < 5; i++) {
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 10), new THREE.MeshBasicMaterial({ color: COLORS.navy }));
    repG.add(d); trendDots.push(d);
  }
  // pie chart
  const pie = new THREE.Group(); pie.position.set(1.15, 2.6, -0.25); repG.add(pie);
  [[0, 0.42, COLORS.teal], [0.42, 0.28, COLORS.coral], [0.70, 0.30, COLORS.gold]].forEach(([s, l, c]) => {
    const slice = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.1, 32, 1, false, s * TAU, l * TAU), mat(c));
    slice.rotation.x = Math.PI / 2; pie.add(slice);
  });
  // flying report pages
  const pages = [];
  const pageM = mat(0xffffff, { side: THREE.DoubleSide });
  for (let i = 0; i < 3; i++) {
    const pg = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.56), pageM);
    const lines = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.05), new THREE.MeshBasicMaterial({ color: COLORS.teal }));
    lines.position.set(0, 0.15, 0.002); pg.add(lines);
    pg.castShadow = true; repG.add(pg); pages.push(pg);
  }
  const repLabel = labelSprite("📊  Reports & Insights", "#1d3557"); repLabel.position.set(0, 4.0, 0); repG.add(repLabel);
  addPerson("hr", 3.9, -0.9, 5.4, -2.6, 2, "present", 0.2, 0x2a1d14);
  addPerson("pc", 8.4, -1.2, 6.4, -2.6, 4, "nod", 0.55, 0x8a5a2b);
  addPerson("pc", 7.9, 0.6, 6.2, -2.2, 1, "cheer", 0.85, 0x111111);

  // ---------- data packets from hub to stations ----------
  const packets = [];
  const packetGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
  const packetM = [COLORS.teal, COLORS.coral, COLORS.gold].map((c) => new THREE.MeshBasicMaterial({ color: c }));
  const targets = [
    STATIONS.agent.clone().add(new THREE.Vector3(0.5, 2.6, 0.5)),
    STATIONS.software.clone().add(new THREE.Vector3(0, 3.1, 0)),
    STATIONS.reports.clone().add(new THREE.Vector3(-0.4, 3.2, 0.3)),
  ];
  targets.forEach((tgt, si) => {
    const start = hub.position.clone();
    const mid = start.clone().lerp(tgt, 0.5).add(new THREE.Vector3(0, 1.6, 1.2));
    const curve = new THREE.QuadraticBezierCurve3(start, mid, tgt);
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(curve.getPoints(40)),
      new THREE.LineDashedMaterial({ color: 0x5f7fa0, dashSize: 0.2, gapSize: 0.15, transparent: true, opacity: 0.6 })
    );
    line.computeLineDistances(); scene.add(line);
    for (let k = 0; k < 4; k++) {
      const m = new THREE.Mesh(packetGeo, packetM[(si + k) % 3]);
      scene.add(m); packets.push({ mesh: m, curve, offset: k / 4 + si * 0.08 });
    }
  });

  // sparkles
  const sparkCount = 90;
  const sparkPos = new Float32Array(sparkCount * 3);
  const sparkSeed = [];
  for (let i = 0; i < sparkCount; i++) {
    sparkSeed.push({ r: 3 + Math.random() * 9, a: Math.random() * TAU, y: 0.5 + Math.random() * 6, k: 1 + Math.floor(Math.random() * 2), p: Math.random() });
  }
  const sparkGeo = new THREE.BufferGeometry(); sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
  const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.09, transparent: true, opacity: 0.85 }));
  scene.add(sparks);

  // ---------- canvas screen drawing ----------
  function drawAgentBuilder(t) {
    const { ctx, w, h } = tablet;
    ctx.fillStyle = "#0e1b2c"; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "#1d3557"; ctx.fillRect(0, 0, w, 38);
    ctx.fillStyle = "#ffffff"; ctx.font = "600 20px Inter, system-ui, sans-serif"; ctx.fillText("Agent Builder", 14, 26);
    ctx.fillStyle = "#19b3a6"; ctx.fillRect(w - 110, 9, 96, 20);
    ctx.fillStyle = "#0e1b2c"; ctx.font = "600 13px Inter, system-ui"; ctx.fillText("LOW-CODE", w - 96, 24);
    const nodes = [
      { x: 70, y: 110, label: "Ask", c: "#ff7a59" },
      { x: 195, y: 190, label: "Policy KB", c: "#f4c430" },
      { x: 320, y: 110, label: "LLM", c: "#19b3a6" },
      { x: 445, y: 190, label: "Reply", c: "#6c8cff" },
    ];
    const appear = (i) => smooth(0.05 + i * 0.13, 0.13 + i * 0.13, t) * (1 - smooth(0.93, 0.99, t));
    ctx.lineWidth = 4;
    for (let i = 0; i < nodes.length - 1; i++) {
      const a = nodes[i], b = nodes[i + 1], p = appear(i + 1);
      if (p <= 0) continue;
      ctx.strokeStyle = "rgba(159,176,200,0.9)";
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x + (b.x - a.x) * p, a.y + (b.y - a.y) * p); ctx.stroke();
    }
    nodes.forEach((n, i) => {
      const p = appear(i); if (p <= 0) return;
      const s = backOut(p);
      ctx.save(); ctx.translate(n.x, n.y); ctx.scale(s, s);
      ctx.fillStyle = n.c; roundRect(ctx, -52, -24, 104, 48, 12); ctx.fill();
      ctx.fillStyle = "#0e1b2c"; ctx.font = "700 17px Inter, system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(n.label, 0, 1); ctx.restore();
    });
    // travelling token along the flow once built
    const run = smooth(0.62, 0.9, t);
    if (run > 0 && run < 1) {
      const seg = run * 3, i = Math.min(2, Math.floor(seg)), f = seg - i;
      const a = nodes[i], b = nodes[i + 1];
      ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, 9, 0, TAU); ctx.fill();
    }
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#9fb0c8"; ctx.font = "500 15px Inter, system-ui";
    ctx.fillText(t > 0.6 && t < 0.93 ? "▶ Test run: “How many leave days do I have?”" : "Drag blocks to build your agent", 14, h - 18);
    tablet.tex.needsUpdate = true;
  }

  function drawInstaller(t) {
    const { ctx, w, h } = monitor;
    const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, "#14263f"); g.addColorStop(1, "#0e1b2c");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // window
    ctx.fillStyle = "#ffffff"; roundRect(ctx, 60, 50, w - 120, h - 100, 16); ctx.fill();
    ctx.fillStyle = "#1d3557"; roundRect(ctx, 60, 50, w - 120, 48, 16); ctx.fill(); ctx.fillRect(60, 80, w - 120, 18);
    ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(88 + i * 22, 74, 7, 0, TAU); ctx.fill(); });
    ctx.fillStyle = "#ffffff"; ctx.font = "600 20px Inter, system-ui"; ctx.fillText("PeopleHub 2.0 — Rollout", 170, 81);
    const prog = smooth(0.06, 0.72, t);
    const done = t >= 0.72;
    ctx.fillStyle = "#12233b"; ctx.font = "700 30px Inter, system-ui";
    ctx.fillText(done ? "Ready for People & Culture!" : "Setting up your new tool…", 96, 160);
    ctx.fillStyle = "#4d607a"; ctx.font = "500 18px Inter, system-ui";
    const steps = ["Migrating employee data", "Configuring workflows", "Training session booked"];
    steps.forEach((s, i) => {
      const ok = prog > (i + 1) / 3.2;
      ctx.fillStyle = ok ? "#19b3a6" : "#c3cfdd";
      ctx.beginPath(); ctx.arc(108, 200 + i * 32, 9, 0, TAU); ctx.fill();
      ctx.fillStyle = ok ? "#12233b" : "#8a9bb2"; ctx.fillText(s, 128, 206 + i * 32);
    });
    ctx.fillStyle = "#e3eaf3"; roundRect(ctx, 96, h - 92, w - 192, 20, 10); ctx.fill();
    const gg = ctx.createLinearGradient(96, 0, w - 96, 0); gg.addColorStop(0, "#19b3a6"); gg.addColorStop(1, "#ff7a59");
    ctx.fillStyle = gg; roundRect(ctx, 96, h - 92, Math.max(20, (w - 192) * prog), 20, 10); ctx.fill();
    ctx.fillStyle = "#12233b"; ctx.font = "700 16px Inter, system-ui"; ctx.textAlign = "right";
    ctx.fillText(Math.round(prog * 100) + "%", w - 96, h - 104); ctx.textAlign = "left";
    // fade to hide the reset at loop boundary
    const fade = smooth(0.94, 1.0, t) + (1 - smooth(0.0, 0.04, t));
    if (fade > 0) { ctx.fillStyle = `rgba(14,27,44,${clamp(fade)})`; ctx.fillRect(0, 0, w, h); }
    monitor.tex.needsUpdate = true;
  }

  // ---------- animation ----------
  function animatePeople(t) {
    people.forEach(({ obj, role, phase }) => {
      const { headPivot, armL, armR, torso } = obj.userData;
      const breathe = wave(t, 2, phase) * 0.02;
      torso.scale.set(1, 1 + breathe, 1);
      obj.position.y = Math.max(0, wave(t, 2, phase)) * 0.03;
      headPivot.rotation.set(0, 0, 0); armL.rotation.set(0, 0, 0); armR.rotation.set(0, 0, 0);
      switch (role) {
        case "explain":
        case "present":
          armR.rotation.x = -1.1 + wave(t, 3, phase) * 0.35;
          armR.rotation.z = 0.25;
          armL.rotation.x = -0.4 + wave(t, 2, phase + 0.25) * 0.25;
          headPivot.rotation.y = wave(t, 1, phase) * 0.35;
          break;
        case "point":
          armR.rotation.x = -1.5 + wave(t, 2, phase) * 0.12;
          armL.rotation.x = -0.2;
          headPivot.rotation.x = -0.15 + wave(t, 2, phase) * 0.08;
          break;
        case "nod":
          headPivot.rotation.x = Math.max(0, wave(t, 4, phase)) * 0.3;
          armL.rotation.x = -0.6; armR.rotation.x = -0.6; armL.rotation.z = 0.5; armR.rotation.z = -0.5; // arms folded-ish
          break;
        case "type":
          armL.rotation.x = -1.2 + wave(t, 10, phase) * 0.08;
          armR.rotation.x = -1.2 + wave(t, 10, phase + 0.5) * 0.08;
          headPivot.rotation.x = 0.2;
          break;
        case "cheer": {
          const c = smooth(0.55, 0.7, t) * (1 - smooth(0.85, 0.98, t));
          armR.rotation.x = -0.3 - c * 2.6;
          armR.rotation.z = -c * 0.3;
          armL.rotation.x = -0.3 - c * 2.4 * smooth(0.6, 0.72, t);
          obj.position.y += c * Math.abs(wave(t, 4)) * 0.18;
          headPivot.rotation.x = -c * 0.25;
          break;
        }
      }
    });
  }

  function animate(t) {
    // camera — gentle sway that returns to start each loop
    const ang = 0.32 * wave(t, 1);
    const radius = camera.aspect < 0.8 ? 21 : 15.5;
    camera.position.set(Math.sin(ang) * radius, 6.8 + 0.4 * wave(t, 1, 0.25), Math.cos(ang) * radius);
    camera.lookAt(0, 2.9, -2.5);

    // hub
    core.rotation.y = TAU * t; core.rotation.x = TAU * t;
    shell.rotation.y = -TAU * t; shell.rotation.z = TAU * t;
    orbit.rotation.z = TAU * t * 2;
    hub.position.y = 5.6 + wave(t, 1) * 0.15;
    hubLight.intensity = 0.7 + 0.3 * (0.5 + 0.5 * wave(t, 4));
    core.scale.setScalar(1 + 0.06 * wave(t, 4));

    // packets
    packets.forEach((p) => {
      const u = (t * 2 + p.offset) % 1;
      p.mesh.position.copy(p.curve.getPoint(u));
      p.mesh.rotation.set(u * TAU * 2, u * TAU * 2, 0);
      p.mesh.scale.setScalar(Math.sin(Math.PI * u) * 1.1 + 0.05);
    });

    // AI agent station
    drawAgentBuilder(t);
    rHead.position.y = 1.55 + wave(t, 2) * 0.05;
    rHead.rotation.y = wave(t, 1, 0.1) * 0.4;
    rArmR.rotation.z = 2.4 + wave(t, 5) * 0.5;    // waving hello
    rArmL.rotation.z = -0.2 + wave(t, 2) * 0.1;
    const blink = (t > 0.46 && t < 0.5) ? 0.1 : 1;
    rEyeL.scale.y = rEyeR.scale.y = blink;
    antTip.scale.setScalar(1 + 0.35 * Math.max(0, wave(t, 4)));
    rChest.material.color.setHSL(0.48, 0.85, 0.45 + 0.2 * (0.5 + 0.5 * wave(t, 3)));
    const scanU = (t * 2) % 1;
    scanRing.position.y = 0.2 + scanU * 1.75;
    scanRing.material.opacity = Math.sin(Math.PI * scanU) * 0.9;
    bubble.material.opacity = smooth(0.5, 0.6, t) * (1 - smooth(0.9, 0.97, t));

    // software station
    drawInstaller(t);
    appIcons.forEach((ic, i) => {
      const u = (t * 2 + i / 4) % 1;
      ic.position.set(-1.0 + i * 0.66, 1.1 + Math.sin(Math.PI * u) * 2.4, 0.3 - u * 0.4);
      ic.rotation.set(u * TAU, u * TAU, 0);
      ic.scale.setScalar(Math.sin(Math.PI * u) * 0.9 + 0.1);
    });
    const cp = smooth(0.72, 0.82, t) * (1 - smooth(0.92, 0.99, t));
    check.scale.setScalar(Math.max(0.0001, backOut(clamp(cp)) * cp + 0.0001));
    check.rotation.y = (1 - cp) * 1.5;

    // reports station
    bars.forEach((b, i) => {
      const g = smooth(0.08 + i * 0.07, 0.38 + i * 0.07, t) * (1 - smooth(0.9, 0.99, t));
      const h = 0.05 + b.h * backOut(g) * g + 0.0001;
      b.mesh.scale.y = Math.max(0.05, h);
      b.mesh.position.y = 1.15 + b.mesh.scale.y / 2;
      const d = trendDots[i];
      d.position.set(b.mesh.position.x, 1.15 + b.mesh.scale.y + 0.18, -0.12);
      d.visible = g > 0.05;
    });
    pie.rotation.z = TAU * t;
    pie.scale.setScalar(0.9 + 0.1 * (0.5 + 0.5 * wave(t, 2)));
    pages.forEach((pg, i) => {
      const u = (t + i / 3) % 1;
      pg.position.set(-0.6 + i * 0.3 + u * 1.4, 1.4 + Math.sin(Math.PI * u) * 2.1, 0.6 + u * 1.6);
      pg.rotation.set(-0.4 + u * 0.8, u * TAU, Math.sin(TAU * u) * 0.3);
      pg.scale.setScalar(Math.sin(Math.PI * u));
    });

    // scenery
    coins.forEach((c) => {
      c.rotation.z = TAU * t;
      c.position.y = c.userData.y + wave(t, 1, c.userData.phase) * 0.3;
    });
    for (let i = 0; i < sparkCount; i++) {
      const s = sparkSeed[i];
      const a = s.a;
      const yy = s.y + ((t * s.k + s.p) % 1) * 2.5;
      sparkPos[i * 3] = Math.cos(a) * s.r;
      sparkPos[i * 3 + 1] = yy;
      sparkPos[i * 3 + 2] = Math.sin(a) * s.r - 2;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    ring.material.emissiveIntensity = 0.3 + 0.25 * (0.5 + 0.5 * wave(t, 2));

    animatePeople(t);
  }

  // ---------- loop / UI ----------
  const progressEl = document.getElementById("progress");
  const timeEl = document.getElementById("time");
  const toggle = document.getElementById("toggle");
  let paused = false, elapsed = 0, last = performance.now();
  toggle.addEventListener("click", () => { paused = !paused; toggle.textContent = paused ? "Play" : "Pause"; });
  window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); toggle.click(); } });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 70 : 44;  // keep the whole scene in view on phones
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  function frame(now) {
    const dt = (now - last) / 1000; last = now;
    if (!paused) elapsed = (elapsed + dt) % LOOP;
    const t = elapsed / LOOP;
    animate(t);
    renderer.render(scene, camera);
    progressEl.style.width = (t * 100).toFixed(2) + "%";
    timeEl.textContent = elapsed.toFixed(1) + " / 5s";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
